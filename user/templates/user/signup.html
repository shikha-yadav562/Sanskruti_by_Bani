<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Sanskruti By Bani</title>
    {% load static %}
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Poppins:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        brand: { 
                            maroon: '#540112', 
                            maroonDeep: '#38000b', 
                            maroonLight: '#6d0318', 
                            gold: '#D4AF37',
                            goldLight: '#e7c27a',
                            cream: '#FAF7F2'
                        } 
                    },
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        serif: ['Cinzel', 'serif'],
                        poppins: ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="h-[100dvh] lg:h-screen overflow-hidden font-sans antialiased text-slate-900 bg-[#2a0109] relative flex items-center justify-center p-4 sm:p-6 md:p-8 selection:bg-[#D4AF37] selection:text-[#540112]">

    <!-- Velvet Maroon, Gold & Soft White Glowing Ambient Glass Blur Orbs Background -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-15%] left-[-15%] w-[650px] h-[650px] bg-[#540112]/90 rounded-full blur-[150px]"></div>
        <div class="absolute bottom-[-15%] right-[-15%] w-[650px] h-[650px] bg-[#8a0a25]/60 rounded-full blur-[160px]"></div>
        <div class="absolute top-[-10%] right-[10%] w-[500px] h-[500px] bg-white/20 rounded-full blur-[140px]"></div>
        <div class="absolute bottom-[10%] left-[10%] w-[480px] h-[480px] bg-white/15 rounded-full blur-[130px]"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[750px] h-[750px] bg-[#D4AF37]/20 rounded-full blur-[170px]"></div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- CENTERED HIGHLY BLURRED GLASS CONTAINER -->
    <div class="relative z-10 w-full max-w-3xl bg-white/10 backdrop-blur-3xl border border-[#D4AF37]/30 rounded-3xl shadow-2xl shadow-black/80 overflow-hidden flex flex-col lg:flex-row max-h-[93dvh] lg:max-h-[92vh]">

        <!-- LEFT SECTION (MAROON BG #540112 MATCHING LOGO) -->
        <div class="lg:w-1/2 min-h-[215px] bg-[#540112] backdrop-blur-3xl p-2 sm:p-8 flex items-center justify-center relative border-b lg:border-b-0 lg:border-r border-[#D4AF37]/20 overflow-hidden">
            <!-- Brand Logo Graphic Image (ONLY SANSKRUTI BY BANI ARTWORK) -->
            <div class="relative z-10 w-full h-full flex items-center justify-center p-2">
                <img src="{% static 'user/assets/brand-logo-full.jpg' %}" class="w-full h-auto max-h-[180px] sm:max-h-[240px] md:max-h-[380px] object-contain rounded-2xl shadow-2xl border border-white/20 transition-transform duration-700 hover:scale-105" alt="Sanskruti By Bani Logo">
            </div>
        </div>

        <!-- RIGHT SECTION (SIGNUP FORM CONTAINER) -->
        <div class="lg:w-1/2 bg-white backdrop-blur-xl p-6 sm:p-8 flex flex-col justify-start lg:justify-center overflow-y-auto custom-scrollbar">
            
            <!-- Card Header -->
            <div class="mb-5 text-center lg:text-left">
                <h2 class="font-serif text-2xl lg:text-[2rem] font-bold text-[#540112] tracking-wide" style="font-family: 'Cinzel', serif;">Create Account</h2>
                <p class="text-xs text-slate-500 mt-1">Register to start your luxury saree shopping.</p>
            </div>

            <!-- SIGNUP FORM -->
            <form id="signup-form" action="{% url 'user:signup' %}" method="POST" class="space-y-3.5">
                {% csrf_token %}

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-[#540112] mb-1">Full Name *</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-[#540112] transition-colors">
                                <i class="ph ph-user text-base"></i>
                            </div>
                            <input type="text" id="full_name" name="full_name" required placeholder="Sharmila Halde" class="w-full pl-10 pr-3 py-2 bg-slate-50/80 border border-[#D4AF37]/30 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-[#540112]/20 focus:border-[#540112] transition-all outline-none font-medium text-slate-900">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-[#540112] mb-1">Username *</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-[#540112] transition-colors">
                                <i class="ph ph-at text-base"></i>
                            </div>
                            <input type="text" id="username" name="username" required placeholder="sharmila.halde" class="w-full pl-10 pr-3 py-2 bg-slate-50/80 border border-[#D4AF37]/30 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-[#540112]/20 focus:border-[#540112] transition-all outline-none font-medium text-slate-900">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-[#540112] mb-1">Email Address *</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-[#540112] transition-colors">
                            <i class="ph ph-envelope text-base"></i>
                        </div>
                        <input type="email" id="email" name="email" required placeholder="you@gmail.com" class="w-full pl-10 pr-3 py-2 bg-slate-50/80 border border-[#D4AF37]/30 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-[#540112]/20 focus:border-[#540112] transition-all outline-none font-medium text-slate-900">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-[#540112] mb-1">Password *</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-[#540112] transition-colors">
                                <i class="ph ph-lock-key text-base"></i>
                            </div>
                            <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-9 py-2 bg-slate-50/80 border border-[#D4AF37]/30 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-[#540112]/20 focus:border-[#540112] transition-all outline-none font-medium text-slate-900">
                            <button type="button" onclick="togglePassword('password')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                                <i class="ph ph-eye text-base"></i>
                            </button>
                        </div>
                        <div class="w-full bg-slate-200 h-1 mt-1.5 rounded-full overflow-hidden">
                            <div id="strength-bar" class="h-full bg-red-500 w-0 transition-all duration-300"></div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-[#540112] mb-1">Confirm Password *</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-[#540112] transition-colors">
                                <i class="ph ph-check-circle text-base"></i>
                            </div>
                            <input type="password" id="confirm_password" required placeholder="••••••••" class="w-full pl-10 pr-9 py-2 bg-slate-50/80 border border-[#D4AF37]/30 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-[#540112]/20 focus:border-[#540112] transition-all outline-none font-medium text-slate-900">
                            <button type="button" onclick="togglePassword('confirm_password')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                                <i class="ph ph-eye text-base"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" id="btn-send-otp" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-[#540112] via-[#6d0318] to-[#38000b] hover:from-[#38000b] hover:to-[#540112] text-[#D4AF37] px-4 py-3.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all shadow-lg border border-[#D4AF37]/40 disabled:opacity-70 disabled:cursor-not-allowed">
                        <span>Register Account</span>
                        <i id="btn-icon" class="ph ph-arrow-right font-bold"></i>
                        <svg id="btn-spinner" class="hidden animate-spin h-5 w-5 text-[#D4AF37]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    </button>
                </div>
            </form>
            
            <!-- Hidden OTP Section -->
            <form id="otp-form" class="hidden space-y-3 transition-all duration-500 opacity-0 transform translate-y-4">
                <div class="text-center p-3 bg-slate-50 border border-[#D4AF37]/30 rounded-xl mb-3">
                    <i class="ph ph-envelope-open text-2xl text-[#540112] mb-1"></i>
                    <p class="text-[10px] font-medium text-slate-700">Enter the 6-digit code sent to</p>
                    <p id="display-email" class="text-xs font-bold text-[#540112]"></p>
                </div>
                
                <div>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-[#540112] transition-colors">
                            <i class="ph ph-password text-lg"></i>
                        </div>
                        <input type="text" id="otp_code" maxlength="6" required placeholder="XXXXXX" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-[#D4AF37]/40 rounded-xl text-center tracking-[0.5em] text-base font-bold focus:bg-white focus:ring-2 focus:ring-[#540112]/20 focus:border-[#540112] transition-all outline-none text-[#540112] uppercase">
                    </div>
                </div>
                
                <div class="flex justify-between items-center text-xs px-1">
                    <span id="countdown" class="text-slate-500 font-medium">Expires in 05:00</span>
                    <button type="button" id="btn-resend" onclick="resendOTP()" disabled class="text-[#540112] font-bold disabled:text-slate-400 transition-colors uppercase text-[10px]">Resend OTP (60s)</button>
                </div>

                <div class="pt-2">
                    <button type="submit" id="btn-verify" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-[#540112] via-[#6d0318] to-[#38000b] hover:from-[#38000b] hover:to-[#540112] text-[#D4AF37] px-4 py-3.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all shadow-lg border border-[#D4AF37]/40">
                        <span>Verify & Create Account</span>
                        <i id="verify-icon" class="ph ph-check-circle font-bold"></i>
                        <svg id="verify-spinner" class="hidden animate-spin h-5 w-5 text-[#D4AF37]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    </button>
                </div>
            </form>

            <div class="mt-4 text-center pt-3 border-t border-slate-200">
                <p class="text-xs text-slate-500">
                    Already have an account? 
                    <a href="{% url 'user:login' %}" class="font-bold text-[#540112] hover:text-[#D4AF37] transition-colors underline uppercase tracking-wider ml-1">Sign in here</a>
                </p>
            </div>

        </div>
    </div>

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');
        const urlParams = new URLSearchParams(window.location.search);
        const nextUrl = urlParams.get('next') || '';

        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colorClass = type === 'success' ? 'bg-emerald-700' : 'bg-[#540112]';
            
            toast.className = `transform transition-all duration-300 translate-y-[-100%] opacity-0 ${colorClass} text-[#D4AF37] px-6 py-3.5 rounded-xl shadow-2xl border border-[#D4AF37]/40 flex items-center gap-3`;
            toast.innerHTML = `<i class="ph ${type === 'success' ? 'ph-check-circle' : 'ph-warning-circle'} text-xl text-[#D4AF37]"></i><span class="text-xs font-semibold text-white">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-[-100%]', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('opacity-0', 'scale-95'); setTimeout(() => toast.remove(), 300); }, 4000);
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text'; icon.classList.replace('ph-eye', 'ph-eye-closed');
            } else {
                input.type = 'password'; icon.classList.replace('ph-eye-closed', 'ph-eye');
            }
        }

        const passwordInput = document.getElementById('password');
        if (passwordInput) {
            passwordInput.addEventListener('input', function(e) {
                const val = e.target.value;
                let strength = 0;
                if(val.length > 7) strength += 25;
                if(val.match(/[A-Z]/)) strength += 25;
                if(val.match(/[0-9]/)) strength += 25;
                if(val.match(/[^a-zA-Z0-9]/)) strength += 25;
                
                const bar = document.getElementById('strength-bar');
                if (bar) {
                    bar.style.width = strength + '%';
                    if(strength <= 25) bar.className = 'h-full transition-all duration-300 bg-red-500';
                    else if(strength <= 50) bar.className = 'h-full transition-all duration-300 bg-orange-500';
                    else if(strength <= 75) bar.className = 'h-full transition-all duration-300 bg-amber-500';
                    else bar.className = 'h-full transition-all duration-300 bg-emerald-500';
                }
            });
        }

        /* ================= OTP TIMERS ================= */
        let expireTimerInterval;
        let resendTimerInterval;

        function startTimers() {
            clearInterval(expireTimerInterval);
            clearInterval(resendTimerInterval);
            
            let expireTimer = 300; // 5 minutes expiry
            let resendTimer = 60;  // 60s cooldown
            
            const display = document.getElementById('countdown');
            const resendBtn = document.getElementById('btn-resend');
            
            resendBtn.disabled = true;
            
            resendTimerInterval = setInterval(function () {
                if (--resendTimer <= 0) {
                    clearInterval(resendTimerInterval);
                    resendBtn.disabled = false;
                    resendBtn.innerText = "Resend OTP";
                } else {
                    resendBtn.innerText = `Resend OTP (${resendTimer}s)`;
                }
            }, 1000);

            expireTimerInterval = setInterval(function () {
                let minutes = parseInt(expireTimer / 60, 10);
                let seconds = parseInt(expireTimer % 60, 10);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                
                display.textContent = "Expires in " + minutes + ":" + seconds;
                
                if (--expireTimer < 0) {
                    clearInterval(expireTimerInterval);
                    display.textContent = "OTP Expired";
                }
            }, 1000);
        }

        /* ================= SIGNUP (SEND OTP) ================= */
        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            if (password !== confirm) {
                showToast("Passwords do not match.");
                return;
            }

            const btn = document.getElementById('btn-send-otp');
            const icon = document.getElementById('btn-icon');
            const spinner = document.getElementById('btn-spinner');
            const btnText = btn.querySelector('span');
            
            btn.disabled = true; icon.classList.add('hidden'); spinner.classList.remove('hidden'); btnText.innerText = 'Sending...';

            const payload = {
                full_name: document.getElementById('full_name').value,
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: password,
            };

            try {
                const response = await fetch('/api/auth/signup/init/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showToast(data.message, 'success');
                    document.getElementById('signup-form').style.display = 'none';
                    const otpForm = document.getElementById('otp-form');
                    otpForm.classList.remove('hidden');
                    setTimeout(() => { otpForm.classList.remove('opacity-0', 'translate-y-4'); }, 50);
                    document.getElementById('display-email').innerText = payload.email;
                    startTimers();
                } else {
                    showToast(data.error);
                }
            } catch (error) {
                showToast("A network error occurred.");
            } finally {
                btn.disabled = false; icon.classList.remove('hidden'); spinner.classList.add('hidden'); btnText.innerText = 'Register Account';
            }
        });

        async function resendOTP() {
            document.getElementById('signup-form').dispatchEvent(new Event('submit'));
        }

        /* ================= OTP VERIFY ================= */
        document.getElementById('otp-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-verify');
            const icon = document.getElementById('verify-icon');
            const spinner = document.getElementById('verify-spinner');
            const btnText = btn.querySelector('span');
            
            btn.disabled = true; icon.classList.add('hidden'); spinner.classList.remove('hidden'); btnText.innerText = 'Verifying...';

            const payload = { otp: document.getElementById('otp_code').value, next: nextUrl };

            try {
                const response = await fetch('/api/auth/signup/verify/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showToast("Account created successfully!", 'success');
                    setTimeout(() => { window.location.href = data.redirect_url; }, 1000);
                } else {
                    showToast(data.error);
                }
            } catch (error) {
                showToast("A network error occurred.");
            } finally {
                btn.disabled = false; icon.classList.remove('hidden'); spinner.classList.add('hidden'); btnText.innerText = 'Verify & Create Account';
            }
        });
    </script>
</body>
</html>
