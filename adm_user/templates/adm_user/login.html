<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Sanskruti By Bani</title>
    {% load static %}
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            maroon: '#71041a',
                            maroonLight: '#8a0a25',
                            gold: '#e7c27a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Cinzel', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen overflow-hidden font-sans antialiased text-slate-900 selection:bg-[#520211] selection:text-white">

    <div class="flex h-full w-full">
        
        <!-- Left Section (Themed Branding) -->
        <div class="hidden lg:flex lg:w-1/2 h-full bg-[#520211] relative flex-col items-center justify-center p-12 overflow-hidden">
            <!-- Elegant Gold Glow -->
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-96 h-96 bg-[#D4AF37]/15 rounded-full blur-[100px]"></div>
            </div>
            
            <!-- Centered Content Wrapper -->
            <div class="relative z-10 flex flex-col items-center justify-center w-full max-w-sm">
                <!-- Elegant Text -->
                <div class="text-center mb-8">
                    <h2 class="font-serif text-3xl xl:text-4xl font-bold text-white mb-3 tracking-wide drop-shadow-md">Admin Portal</h2>
                    <div class="h-px w-20 bg-gradient-to-r from-transparent via-[#D4AF37] to-transparent mx-auto mb-3"></div>
                    <p class="text-[#D4AF37]/90 font-light tracking-wider text-sm uppercase">Sanskruti By Bani</p>
                </div>

                <!-- Frosted Glass Frame for Image (Decreased Size) -->
                <div class="p-2.5 sm:p-3 rounded-[2.5rem] bg-white/5 backdrop-blur-xl border border-white/20 shadow-2xl shadow-black/80 w-full max-w-[13rem] xl:max-w-[16rem] transition-transform duration-700 hover:scale-[1.02]">
                    <img src="{% static 'user/assets/admin_login_bg.jpg' %}" class="w-full h-auto rounded-[2rem] object-cover" alt="Sanskruti By Bani">
                </div>
            </div>
        </div>

        <!-- Right Form Section -->
        <div class="w-full lg:w-1/2 h-full flex flex-col items-center justify-center p-6 sm:p-10 lg:p-16 bg-white relative">
            
            <div class="w-full max-w-md mx-auto">
                
                <div class="mb-8 text-center lg:text-left">
                    <div class="lg:hidden inline-flex items-center justify-center w-14 h-14 bg-gradient-to-br from-[#520211] to-[#3a010c] rounded-xl shadow-lg mb-4">
                        <i class="ph ph-crown text-2xl text-[#D4AF37]"></i>
                    </div>
                    <h2 class="font-serif text-3xl font-bold text-[#520211] mb-2">Welcome Back</h2>
                    <p class="text-slate-500">Sign in to manage the store.</p>
                </div>

                <form action="#" method="POST" class="space-y-5">
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Email or Username</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-[#520211] transition-colors">
                                <i class="ph ph-user text-lg"></i>
                            </div>
                            <input type="text" name="username" required placeholder="admin@sanskruti.com" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200/80 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-[#520211]/20 focus:border-[#520211] transition-all outline-none placeholder:text-slate-400 font-medium text-slate-900">
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label class="block text-sm font-semibold text-slate-700">Password</label>
                            <a href="#" class="text-xs font-semibold text-[#520211] hover:text-[#7a041a] transition-colors">Forgot Password?</a>
                        </div>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-[#520211] transition-colors">
                                <i class="ph ph-lock-key text-lg"></i>
                            </div>
                            <input type="password" name="password" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200/80 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-[#520211]/20 focus:border-[#520211] transition-all outline-none placeholder:text-slate-400 font-medium text-slate-900">
                        </div>
                    </div>

                    <div class="flex items-center pt-2">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <div class="relative flex items-center justify-center w-5 h-5 rounded border border-slate-300 group-hover:border-[#520211] transition-colors bg-white">
                                <input type="checkbox" class="absolute opacity-0 w-full h-full cursor-pointer peer">
                                <i class="ph ph-check text-[#520211] opacity-0 peer-checked:opacity-100 transition-opacity"></i>
                            </div>
                            <span class="text-sm font-medium text-slate-600">Keep me logged in</span>
                        </label>
                    </div>

                    <div class="pt-4">
                        <button type="submit" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-[#520211] to-[#3a010c] hover:from-[#3a010c] hover:to-[#520211] text-[#D4AF37] px-4 py-4 rounded-xl font-bold transition-all shadow-lg shadow-[#520211]/25 hover:shadow-[#520211]/40 hover:-translate-y-0.5">
                            Sign In
                            <i class="ph ph-arrow-right font-bold"></i>
                        </button>
                    </div>

                </form>
                
                <div class="mt-8 text-center">
                    <p class="text-sm text-slate-500">
                        Don't have access? 
                        <a href="{% url 'adm_user:signup' %}" class="font-semibold text-[#520211] hover:text-[#7a041a] transition-colors">Create an account</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
